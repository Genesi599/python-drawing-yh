[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing-yh"
version = "0.1.0"
description = "Python 科研作图工具包"
requires-python = ">=3.8"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "shapely",
    "scikit-learn",
    "matplotlib-venn",
    "pycirclize",
    "Pillow",
    "python-pptx",
    "pywin32; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["drawing_yh*"]

[tool.setuptools.package-data]
"drawing_yh.report" = ["templates/*.css", "templates/*.py"]
"drawing_yh.cell_schematic" = [
    "README.md",
    "templates/*.svg",
    "templates/*.png",
    "templates/*.json",
    "templates/*.md",
    "templates/assets/*.svg",
    "templates/assets/external/*.png",
    "templates/assets/detail/*.svg",
    "templates/assets/detail/*.license.txt",
]
